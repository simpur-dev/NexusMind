<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusMind 准备就绪页视觉方案</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Noto Sans SC", system-ui, sans-serif;
      color: #243f4d;
      background: #f6fbff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(147,197,253,.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(147,197,253,.16) 1px, transparent 1px),
        radial-gradient(circle at 84% 8%, rgba(96,165,250,.16), transparent 34%),
        #f6fbff;
      background-size: 42px 42px, 42px 42px, 100% 100%;
    }
    header {
      padding: 32px 40px 8px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      letter-spacing: -0.6px;
    }
    p {
      margin: 0;
      color: rgba(58,90,106,.76);
      line-height: 1.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      padding: 28px 40px 44px;
    }
    .card {
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(147,197,253,.45);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 22px 60px rgba(59,130,246,.12), inset 0 0 0 1px rgba(255,255,255,.72);
    }
    .card h2 {
      margin: 2px 4px 12px;
      font-size: 18px;
    }
    .card img {
      display: block;
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(147,197,253,.35);
      background: white;
    }
    .note {
      margin: 14px 4px 0;
      font-size: 13px;
      color: rgba(58,90,106,.68);
    }
    @media (max-width: 1200px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>NexusMind「准备就绪」页视觉方案</h1>
    <p>这只是静态视觉稿：不接后端、不接接口、不改上传、路由或模拟启动逻辑。选中后再把对应布局落到现有前端组件里。</p>
  </header>
  <main class="grid">
    <section class="card">
      <h2>方案 A：左右指挥台布局</h2>
      <img src="./home-ready-option-a.svg" alt="方案 A：左右指挥台布局" />
      <p class="note">最接近当前页面，演示稳定，适合小改升级。</p>
    </section>
    <section class="card">
      <h2>方案 B：顶部启动台布局</h2>
      <img src="./home-ready-option-b.svg" alt="方案 B：顶部启动台布局" />
      <p class="note">标题区更强，右侧操作更集中，比赛录屏冲击力更强。</p>
    </section>
    <section class="card">
      <h2>方案 C：三栏事件启动器</h2>
      <img src="./home-ready-option-c.svg" alt="方案 C：三栏事件启动器" />
      <p class="note">结构打散重构，流程、上传、提示词三块分离，信息最清楚。</p>
    </section>
  </main>
</body>
</html>
