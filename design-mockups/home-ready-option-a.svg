    <g font-family="Noto Sans SC, Arial">
      <circle cx="142" cy="510" r="20" fill="#E3F2FF" stroke="#73A8B9"/><text x="132" y="516" font-size="13" font-weight="800" fill="#3A5A6A">01</text><text x="186" y="510" font-size="20" font-weight="800" fill="#243F4D">图谱构建</text><text x="186" y="536" font-size="14" fill="#6C8795">完成 GraphRAG 知识图谱构建</text>
      <circle cx="142" cy="570" r="20" fill="#E3F2FF" stroke="#73A8B9"/><text x="132" y="576" font-size="13" font-weight="800" fill="#3A5A6A">02</text><text x="186" y="570" font-size="20" font-weight="800" fill="#243F4D">环境搭建</text><text x="186" y="596" font-size="14" fill="#6C8795">生成智能体设定与仿真参数</text>
      <circle cx="142" cy="630" r="20" fill="#E3F2FF" stroke="#73A8B9"/><text x="132" y="636" font-size="13" font-weight="800" fill="#3A5A6A">03</text><text x="186" y="630" font-size="20" font-weight="800" fill="#243F4D">世界模型推演</text><text x="186" y="656" font-size="14" fill="#6C8795">多 Agent 并行讨论与状态演化</text>
      <circle cx="142" cy="690" r="20" fill="#E3F2FF" stroke="#73A8B9"/><text x="132" y="696" font-size="13" font-weight="800" fill="#3A5A6A">04</text><text x="186" y="690" font-size="20" font-weight="800" fill="#243F4D">报告生成</text><text x="186" y="716" font-size="14" fill="#6C8795">输出可解释预测报告</text>
      <circle cx="142" cy="750" r="20" fill="#3A5A6A"/><text x="132" y="756" font-size="13" font-weight="800" fill="white">05</text><text x="186" y="750" font-size="20" font-weight="800" fill="#243F4D">深度互动</text><text x="186" y="776" font-size="14" fill="#6C8795">与角色或 ReportAgent 连续追问</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="670" y="140" width="850" height="660" rx="34" fill="url(#panel)" stroke="#BBD9F2"/>
    <rect x="710" y="184" width="770" height="60" rx="18" fill="#E8F5FF" stroke="#C7DDF2"/>
    <rect x="716" y="190" width="382" height="48" rx="14" fill="white" stroke="#9FC8E8"/>
    <text x="870" y="220" text-anchor="middle" font-family="Noto Sans SC, Arial" font-size="16" font-weight="700" fill="#3A5A6A">文件上传</text>
    <text x="1290" y="220" text-anchor="middle" font-family="Noto Sans SC, Arial" font-size="16" fill="#7A95A3">网络抓取</text>
    <text x="710" y="276" font-family="JetBrains Mono, monospace" font-size="16" fill="#3A5A6A">01 / 现实种子</text>
    <rect x="710" y="298" width="770" height="230" rx="28" fill="#F7FCFF" stroke="#93C5FD" stroke-dasharray="9 8"/>
    <rect x="1040" y="366" width="110" height="90" rx="24" fill="white" stroke="#C7DDF2"/>
    <text x="1095" y="409" text-anchor="middle" font-family="Arial" font-size="32" fill="#3A5A6A">↑</text>
    <text x="1095" y="438" text-anchor="middle" font-family="Noto Sans SC, Arial" font-size="18" font-weight="800" fill="#3A5A6A">拖拽文件上传</text>
    <text x="1095" y="464" text-anchor="middle" font-family="Noto Sans SC, Arial" font-size="14" fill="#7A95A3">支持 PDF / MD / TXT</text>
    <rect x="710" y="548" width="770" height="46" rx="14" fill="#EAF6FF" stroke="#D4E8F7"/>
    <text x="740" y="577" font-family="Noto Sans SC, Arial" font-size="15" fill="#3A5A6A">□ 同时启用网络抓取</text>
    <text x="910" y="577" font-family="Noto Sans SC, Arial" font-size="13" fill="#7A95A3">补充公开舆情信息</text>
    <text x="710" y="642" font-family="JetBrains Mono, monospace" font-size="16" fill="#3A5A6A">02 / 模拟提示词</text>
    <rect x="710" y="664" width="770" height="88" rx="22" fill="white" stroke="#C7DDF2"/>
    <text x="738" y="698" font-family="JetBrains Mono, monospace" font-size="14" fill="#9AB0BB">// 描述事件背景与决策问题，例如：未来两周舆情是否会二次发酵？</text>
    <rect x="710" y="774" width="770" height="62" rx="20" fill="url(#primary)"/>
    <text x="742" y="813" font-family="JetBrains Mono, monospace" font-size="20" font-weight="800" fill="white">启动引擎</text>
    <text x="1442" y="813" text-anchor="end" font-family="Arial" font-size="24" fill="white">↗</text>
  </g>
