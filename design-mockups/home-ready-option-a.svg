<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="0.52" stop-color="#EEF7FF"/>
      <stop offset="1" stop-color="#EAF5FA"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3A5A6A"/>
      <stop offset="1" stop-color="#73A8B9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="rgba(255,255,255,0.96)"/>
      <stop offset="1" stop-color="rgba(238,247,255,0.82)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#3B82F6" flood-opacity="0.12"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#93C5FD" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1260" cy="140" r="260" fill="#60A5FA" opacity="0.12"/>
  <circle cx="280" cy="760" r="320" fill="#73A8B9" opacity="0.10"/>

  <g transform="translate(34 28)">
    <circle cx="24" cy="24" r="24" fill="#DDF3FA" stroke="#93C5FD"/>
    <path d="M14 26C20 14 30 14 36 26C30 38 20 38 14 26Z" fill="url(#primary)"/>
    <text x="62" y="22" font-family="Space Grotesk, Arial" font-size="22" font-weight="800" fill="#3A5A6A" letter-spacing="1.6">NexusMind</text>
    <text x="62" y="42" font-family="Noto Sans SC, Arial" font-size="12" fill="#7A95A3">群体智能引擎</text>
  </g>
  <g transform="translate(1310 30)">
    <circle cx="24" cy="22" r="18" fill="#73A8B9"/>
    <text x="18" y="27" font-family="JetBrains Mono, monospace" font-size="14" fill="white" font-weight="700">A</text>
    <text x="54" y="27" font-family="JetBrains Mono, monospace" font-size="14" fill="#3A5A6A">admin</text>
    <rect x="126" y="0" width="160" height="44" rx="14" fill="white" fill-opacity="0.72" stroke="#C7DDF2"/>
    <text x="155" y="27" font-family="Noto Sans SC, Arial" font-size="14" fill="#3A5A6A">访问 GitHub ↗</text>
  </g>

  <text x="80" y="128" font-family="JetBrains Mono, monospace" font-size="18" fill="#73A8B9" letter-spacing="2">OPTION A · COMMAND CENTER SPLIT</text>
  <text x="80" y="170" font-family="Noto Sans SC, Arial" font-size="48" font-weight="800" fill="#243F4D">准备就绪</text>
  <text x="80" y="207" font-family="Noto Sans SC, Arial" font-size="20" fill="#587383">上传材料，启动从图谱构建到世界模型推演的完整链路。</text>

  <g filter="url(#shadow)">
    <rect x="80" y="246" width="520" height="132" rx="28" fill="url(#panel)" stroke="#C7DDF2"/>
    <rect x="108" y="274" width="214" height="76" rx="20" fill="#FFFFFF" stroke="#D4E8F7"/>
    <text x="132" y="307" font-family="Noto Sans SC, Arial" font-size="28" font-weight="800" fill="#3A5A6A">零试错</text>
    <text x="132" y="333" font-family="Noto Sans SC, Arial" font-size="14" fill="#6C8795">全场景决策推演未来最优解</text>
    <rect x="350" y="274" width="214" height="76" rx="20" fill="#FFFFFF" stroke="#D4E8F7"/>
    <text x="374" y="307" font-family="Noto Sans SC, Arial" font-size="28" font-weight="800" fill="#3A5A6A">高可扩</text>
    <text x="374" y="333" font-family="Noto Sans SC, Arial" font-size="14" fill="#6C8795">百万级 Agent 并行构建</text>
  </g>

